<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background square (neo-brutalist style) -->
  <rect width="64" height="64" fill="#000000"/>
  <!-- Pink accent top-right corner -->
  <rect x="44" y="0" width="20" height="20" fill="#FF90E8"/>
  <!-- Yellow accent bottom-left -->
  <rect x="0" y="44" width="20" height="20" fill="#FFE500"/>
  <!-- Teal accent bottom-right -->
  <rect x="44" y="44" width="20" height="20" fill="#23A094"/>
  <!-- White "P" letter bold -->
  <text x="8" y="46" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">P</text>
  <!-- Pink "2" overlay top right -->
  <text x="36" y="26" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="22" fill="#FF90E8">2</text>
</svg>
